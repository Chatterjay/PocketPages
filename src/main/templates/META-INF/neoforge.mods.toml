
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="logo.png"
credits="Inspired by the original InfiniteInvo mod."
authors="Chatterjay"
description='''
A paged player inventory for Minecraft 1.21.1 NeoForge.
'''

[[mixins]]
config="${mod_id}.mixins.json"
[[dependencies.${mod_id}]]
modId="neoforge" #mandatory
   type="required" #mandatory
     versionRange="[${neo_version},)" #mandatory
   ordering="NONE"
     side="BOTH"


[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
      versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="accessories"
    type="optional"
    versionRange="[1.1.0-beta,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="aether"
    type="optional"
    versionRange="[1.5,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="apothic_attributes"
    type="optional"
    versionRange="[2.10,)"
    ordering="AFTER"
    side="CLIENT"
